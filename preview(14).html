/* NUMBER GENERATORS: 0–1000 */
const unitsTR=["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"];
const tensTR=["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
function numberTR(n){
 if(n<10)return unitsTR[n];
 if(n<100)return tensTR[Math.floor(n/10)]+(n%10?" "+unitsTR[n%10]:"");
 if(n===100)return "yüz";
 if(n<1000)return (Math.floor(n/100)===1?"yüz":unitsTR[Math.floor(n/100)]+" yüz")+(n%100?" "+numberTR(n%100):"");
 return "bin";
}

const unitsES=["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve"];
const teensES=["diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve"];
const tensES=["","","veinte","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
function numberES(n){
 if(n<10)return unitsES[n];
 if(n<20)return teensES[n-10];
 if(n<30)return n===20?"veinte":"veinti"+unitsES[n-20];
 if(n<100)return tensES[Math.floor(n/10)]+(n%10?" y "+unitsES[n%10]:"");
 if(n===100)return "cien";
 if(n<200)return "ciento "+numberES(n-100);
 if(n<300)return "doscientos"+(n%100?" "+numberES(n%100):"");
 if(n<400)return "trescientos"+(n%100?" "+numberES(n%100):"");
 if(n<500)return "cuatrocientos"+(n%100?" "+numberES(n%100):"");
 if(n<600)return "quinientos"+(n%100?" "+numberES(n%100):"");
 if(n<700)return "seiscientos"+(n%100?" "+numberES(n%100):"");
 if(n<800)return "setecientos"+(n%100?" "+numberES(n%100):"");
 if(n<900)return "ochocientos"+(n%100?" "+numberES(n%100):"");
 if(n<1000)return "novecientos"+(n%100?" "+numberES(n%100):"");
 return "mil";
}

const unitsFR=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf"];
const teensFR=["dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
function under100FR(n){
 if(n<10)return unitsFR[n];
 if(n<20)return teensFR[n-10];
 if(n<70){
  let t=Math.floor(n/10),u=n%10;
  let base=["","","vingt","trente","quarante","cinquante","soixante"][t];
  if(!u)return base;
  if(u===1)return base+" et un";
  return base+"-"+unitsFR[u];
 }
 if(n<80)return n===71?"soixante et onze":"soixante-"+under100FR(n-60);
 if(n<100)return n===80?"quatre-vingts":"quatre-vingt-"+under100FR(n-80);
}
function numberFR(n){
 if(n<100)return under100FR(n);
 if(n===100)return "cent";
 if(n<200)return "cent "+under100FR(n-100);
 if(n<1000){
  let h=Math.floor(n/100),r=n%100;
  let head=h===2?"deux cents":unitsFR[h]+" cent";
  if(r===0&&h>1)return head;
  return (h===1?"cent":head)+(r?" "+under100FR(r):"");
 }
 return "mille";
}

const unitsAR=["صفر","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة"];
const tensAR=["","عشرة","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
const teensAR=["عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
function numberAR(n){
 if(n<10)return unitsAR[n];
 if(n<20)return teensAR[n-10];
 if(n<100){
  let t=Math.floor(n/10),u=n%10;
  return u?unitsAR[u]+" و"+tensAR[t]:tensAR[t];
 }
 if(n===100)return "مئة";
 if(n<200)return "مئة"+(n%100?" و"+numberAR(n%100):"");
 if(n<300)return "مئتان"+(n%100?" و"+numberAR(n%100):"");
 if(n<1000){
  let h=Math.floor(n/100);
  const hundreds=["","","","ثلاثمئة","أربعمئة","خمسمئة","ستمئة","سبعمئة","ثمانمئة","تسعمئة"];
  let head=h===2?"مئتان":h===1?"مئة":hundreds[h];
  return head+(n%100?" و"+numberAR(n%100):"");
 }
 return "ألف";
}
function numberAU(n){
 const a=["zero","one","two","three","four","five","six","seven","eight","nine"];
 const b=["ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
 const c=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
 if(n<10)return a[n];
 if(n<20)return b[n-10];
 if(n<100)return c[Math.floor(n/10)]+(n%10?"-"+a[n%10]:"");
 if(n<1000)return a[Math.floor(n/100)]+" hundred"+(n%100?" and "+numberAU(n%100):"");
 if(n===1000)return "one thousand";
 return "";
}
function numberAUdisplay(n){
 if(n===1000)return "one thousand";
 return numberAU(n);
}

/* Arabic number names above are simple standard forms.
   French and Spanish use common written forms. */
const numberFns={
"Turkish":numberTR,
"Spanish":numberES,
"Arabic":numberAR,
"Australian English":numberAUdisplay,
"French":numberFR
};
for(const lang of Object.keys(numberFns)){
 for(let n=0;n<=1000;n++){
  const word=numberFns[lang](n);
  data.push({lang,cat:"Numbers",word,en:String(n)});
 }
}

/* Add useful numbers with English numeric labels as well.
   The word is written in the selected language. */

let language="Turkish";
function setLang(lang,btn){
 language=lang;
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 render();
}
function render(){
 const query=document.getElementById("search").value.trim().toLowerCase();
 const cat=document.getElementById("category").value;
 const grid=document.getElementById("grid");
 grid.innerHTML="";
 const filtered=data.filter(x=>
  (language==="All"||x.lang===language)&&
  (cat==="All Categories"||x.cat===cat)&&
  (x.word.toLowerCase().includes(query)||
   x.en.toLowerCase().includes(query))
 );
 document.getElementById("wordCount").textContent=
  filtered.length.toLocaleString()+" results found";
 const fragment=document.createDocumentFragment();
 filtered.forEach(item=>{
  const card=document.createElement("div");
  card.className="card";
  if(item.lang==="Arabic")card.dir="auto";

  const w=document.createElement("div");
  w.className="word";
  w.textContent=item.word;

  const en=document.createElement("div");
  en.className="meaning";
  en.textContent="English: "+item.en;

  const meta=document.createElement("div");
  meta.className="meta";
  meta.textContent=flags[item.lang]+" "+item.lang+" • "+item.cat;

  const btn=document.createElement("button");
  btn.className="copy";
  btn.textContent="📋 Copy Word";
  btn.onclick=async()=>{
   try{
    await navigator.clipboard.writeText(item.word);
    btn.textContent="✅ Copied!";
    setTimeout(()=>btn.textContent="📋 Copy Word",1200);
   }catch{
    const area=document.createElement("textarea");
    area.value=item.word;
    document.body.appendChild(area);
    area.select();
    try{
     document.execCommand("copy");
     btn.textContent="✅ Copied!";
    }catch{
     btn.textContent="Select and copy manually";
    }
    area.remove();
    setTimeout(()=>btn.textContent="📋 Copy Word",1600);
   }
  };
  card.append(w,en,meta,btn);
  fragment.appendChild(card);
 });
 if(!filtered.length){
  const empty=document.createElement("div");
  empty.className="empty";
  empty.textContent="No results found. Try another search.";
  fragment.appendChild(empty);
 }
 grid.appendChild(fragment);
}
render();
